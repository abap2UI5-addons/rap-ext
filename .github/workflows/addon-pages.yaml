name: addon-pages

# The site of an abap2UI5 addon on GitHub Pages
# (https://abap2ui5-addons.github.io/<addon>/), built with VitePress from
# site/ (npm run site) - the same shape on every addon site
# (.github/ci/README.md). A pull request builds it, a push to main deploys
# it. The repository's Pages source must be "GitHub Actions" (Settings >
# Pages), and the caller grants pages: write and id-token: write to the job
# that calls this workflow.

on:
  workflow_call:
    inputs:
      branch:
        description: 'the branch the badges are published from and the site deployed from - the default branch of a repository whose default is not main (e.g. standard)'
        type: string
        default: 'main'
      node-version:
        type: string
        default: '22'
      install:
        description: 'shell that installs what the build needs'
        type: string
        default: 'npm ci --prefix site'
      build:
        description: 'shell that builds the site into path'
        type: string
        default: 'npm run site'
      cache-dependency-path:
        type: string
        default: 'site/package-lock.json'
      path:
        description: 'the built site'
        type: string
        default: 'build/site'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        # the last-updated time of a page comes from the history
        fetch-depth: 0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
    - run: ${{ inputs.install }}
    - run: ${{ inputs.build }}
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: ${{ inputs.path }}

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', inputs.branch)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
