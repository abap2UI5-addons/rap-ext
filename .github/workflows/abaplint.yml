# The one automated verification this repo has: abaplint with dependency
# resolution against the steampunk-2305 API set and the abap2UI5 core repo
# (both cloned by abaplint from the URLs in abaplint.jsonc). Zero issues is
# the gate - see AGENTS.md "Build & verify".
name: abaplint

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: abaplint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  abaplint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: abaplint (expect 0 issues)
        run: npx --yes @abaplint/cli@latest abaplint.jsonc
