# The branch `cloud` - rap-ext for ABAP Cloud: main plus one commit that
# puts the files of cloud/ in place of the ones of the same name in src/,
# force-pushed on every push to main (the pattern of abap2UI5's 702
# branch). Checked by npm run lint:cloud before it is published. Nobody
# commits to `cloud` by hand - README "ABAP Cloud", cloud/README.md.
name: cloud-branch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: cloud-branch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # builds build/cloud and checks it - nothing is published when it fails
      - name: Build and check the cloud version (expect 0 issues)
        run: npm run lint:cloud
      - name: Put the files of cloud/ into src/
        run: node scripts/cloud.mjs apply
      # The Source-Commit trailer names the main commit the branch was built
      # from.
      - name: Commit on top of main and force-push the branch cloud
        env:
          SHA: ${{ github.sha }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -q -m 'Cloud version: the files of cloud/ in src/' -m "Source-Commit: $SHA"
          git push --force origin HEAD:cloud
