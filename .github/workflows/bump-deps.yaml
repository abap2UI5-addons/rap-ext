name: bump-deps

# Every dependency update of this repository, once a month, in ONE pull
# request - on the last Sunday of the month (the shared CI template,
# addon-bump-deps.yaml, .github/ci/README.md): npm, the pinned GitHub Actions
# (with the DEPS_TOKEN secret), and the abap2UI5 release this repository is
# checked against (scripts/core-pin.mjs). Nothing else updates dependencies
# on a schedule; Dependabot's security updates are a repository setting and
# stay as they are.

on:
  schedule:
    - cron: '17 4 * * 0'   # Sundays 04:17 UTC - the template picks the last one of the month
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bump-deps
  cancel-in-progress: false

jobs:
  bump-deps:
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/addon-bump-deps.yaml
    with:
      repository: abap2UI5-addons/rap-ext
      extra: node scripts/core-pin.mjs set "$(node scripts/core-pin.mjs latest)"
    secrets:
      DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
