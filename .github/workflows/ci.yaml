# The checks of this repository, from the shared CI template of
# abap2UI5-addons, which lives here (.github/ci/README.md) - called locally,
# so this repository runs every change of the template before an addon does.
#
#   abaplint      ./abaplint.jsonc (expect 0 issues)
#   lint:cloud    builds the branch cloud (scripts/cloud.mjs), then abaplint
#                 on it: the ABAP Cloud language version, the released API set
#   unit          the ABAP Unit tests that need no system (scripts/unit.mjs)
#   abap2ui5lint  every view the floorplans build, rendered headless
#
# The core is pinned to a release tag (abaplint.jsonc, scripts/core-pin.mjs).
# The weekly run is the canary against the core's main branch: a rename there
# used to break this repository silently - every floorplan named a class the
# core does not ship, abaplint reported 55 errors, and the badge stayed green
# for ten days because no pull request was opened in between.
name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # write only for publish-badges, which runs on main and never for a pull
    # request; every job that runs the code keeps a read-only token
    permissions:
      contents: write
    uses: ./.github/workflows/addon-check.yaml
    with:
      abaplint: '["./abaplint.jsonc"]'
      npm-scripts: '["lint:cloud"]'
      unit: true
      canary: ${{ github.event_name == 'schedule' }}
      canary-setup: node scripts/core-pin.mjs set main
