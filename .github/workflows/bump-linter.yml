# The linter comes from npm as @abap2ui5/linter, and package-lock.json decides
# which version the gate runs - a new release reaches this repository only when
# the lock moves. This workflow moves it (with its render runtime, which is one
# release with the linter) to `latest` weekly, runs the view gate on it, and
# opens a pull request. Same shape as abap2UI5/samples' bump-linter.
name: bump-linter

on:
  schedule:
    - cron: '53 6 * * 1'   # Mondays 06:53 UTC
  workflow_dispatch:

concurrency:
  group: bump-linter

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-linter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'

    - name: Move @abap2ui5/linter to the latest published version
      id: pin
      run: |
        set -euo pipefail
        VERSION=$(npm view @abap2ui5/linter version)
        test -n "$VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        npm install --save-dev "@abap2ui5/linter@$VERSION" "@abap2ui5/linter-render@$VERSION"
        if git diff --quiet package.json package-lock.json; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - if: steps.pin.outputs.changed == 'true'
      run: npx playwright install --with-deps chromium
    - if: steps.pin.outputs.changed == 'true'
      run: npm run check:abap2ui5

    - if: steps.pin.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        branch: bump-linter
        title: 'Bump @abap2ui5/linter to ${{ steps.pin.outputs.version }}'
        commit-message: 'Bump @abap2ui5/linter to ${{ steps.pin.outputs.version }}'
        body: |
          Weekly move of `@abap2ui5/linter` and `@abap2ui5/linter-render` to
          the latest version on npm (${{ steps.pin.outputs.version }}). The
          view gate ran over every floorplan in the workflow that opened this
          pull request.
