name: addon-bump-deps

# Every dependency update of an abap2UI5 addon, once a month, in ONE pull
# request (.github/ci/README.md) - on the last Sunday of the month. The caller
# schedules it every Sunday; the first step goes on only when a week later is
# another month (GitHub's cron cannot say "the last Sunday"). A manual
# dispatch always goes on.
#
#   - the files abap2UI5 is the source of (its .github/shared/, the manifest
#     of its shared-file-gate.mjs): update-deps.mjs and rename.mjs, first
#   - npm and pinned GitHub Actions: the addon's .github/scripts/update-deps.mjs
#     (the same file in every repository of abap2UI5 and abap2UI5-addons);
#     with `--actions`, which moves every `uses: owner/repo...@<sha> # <tag>`
#     - this template's own pin included - to the latest release of
#     owner/repo (what that changes under .github/workflows only reaches
#     the pull request with the DEPS_TOKEN secret)
#   - `extra`: what else the addon pins (e.g. the abap2UI5 release tag:
#     node scripts/core-pin.mjs set "$(node scripts/core-pin.mjs latest)")
#   - .github/deps.json: every sibling to the tip of its branch
#     (.github/ci/pin-deps.mjs bump)
#
# The checks of the pull request are the gate: they run against the new pins.
# The default token may not change files under .github/workflows/ and a pull
# request it opens starts no workflow, so the caller passes DEPS_TOKEN (a
# token that may push workflow files) when it has one. The caller grants
# contents: write and pull-requests: write to the job that calls this.
#
# Two jobs, because npm installs freshly published packages and runs their
# install scripts - and anything run in a job can tamper with the later steps
# of that job ($GITHUB_ENV, $GITHUB_PATH, the files they execute). So `update`
# runs npm, the repository's scripts and `extra` with no secret at all: a
# read-only token, no credential in .git/config, and `--actions` reads the
# latest releases (public data) with that read-only token. What it changed
# goes to `pr` as a patch. `pr` is the only job DEPS_TOKEN reaches, and it
# runs nothing of the repository's: a fresh checkout, the patch, the pull
# request. Without DEPS_TOKEN it leaves the changes under .github/workflows
# out - the one thing the default token may not push.

on:
  workflow_call:
    inputs:
      repository:
        description: 'owner/repo that opens the pull request - a fork does nothing'
        type: string
        required: true
      node-version:
        type: string
        default: '22'
      extra:
        description: 'shell run after the npm and Actions update'
        type: string
        default: ''
    secrets:
      DEPS_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  # npm, update-deps.mjs, `extra` and pin-deps.mjs - with no secret in the job:
  # contents: read, persist-credentials: false, and GH_TOKEN is the job's own
  # read-only token (the `gh` calls of `--actions` read public releases)
  update:
    if: github.repository == inputs.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      go: ${{ steps.when.outputs.go }}
    steps:
    - name: Only on the last Sunday of the month
      id: when
      run: |
        if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$(date -u -d '+7 days' +%m)" = "$(date -u +%m)" ]; then
          echo "not the last Sunday of the month - nothing to do"
          echo "go=false" >> "$GITHUB_OUTPUT"
        else
          echo "go=true" >> "$GITHUB_OUTPUT"
        fi

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: steps.when.outputs.go == 'true'
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: steps.when.outputs.go == 'true'
      with:
        node-version: ${{ inputs.node-version }}

    # the files abap2UI5 is the source of and this addon carries a copy of
    # (.github/scripts/update-deps.mjs, .github/scripts/rename.mjs) - the
    # manifest comes from abap2UI5's shared-file-gate.mjs, which names the
    # addons as owner/repo. Before the npm step, so the month's update runs
    # the current update-deps.mjs. An addon that is no consumer gets an
    # empty manifest and nothing changes
    - name: Check out abap2UI5 for the shared files
      if: steps.when.outputs.go == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: abap2UI5/abap2UI5
        ref: main
        path: .abap2UI5
        persist-credentials: false
        sparse-checkout: |
          .claude
          .github
          docs
    - name: Copy every shared file
      if: steps.when.outputs.go == 'true'
      run: |
        set -euo pipefail
        GATE=.abap2UI5/.github/scripts/shared-file-gate.mjs
        test -f "$GATE" || { echo "::error::$GATE is missing - abap2UI5 moved the gate, fix the path here"; exit 1; }
        node "$GATE" --manifest "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/manifest.txt"
        while IFS=$'\t' read -r src dst; do
          [ -n "$src" ] || continue
          test -f ".abap2UI5/$src" || { echo "::error::.abap2UI5/$src does not exist"; exit 1; }
          mkdir -p "$(dirname "$dst")"
          cp ".abap2UI5/$src" "$dst"
          echo "  $src -> $dst"
        done < "$RUNNER_TEMP/manifest.txt"
        rm -rf .abap2UI5
        if ! git diff --quiet; then
          # appended to the summary after update-deps.mjs, which writes it anew;
          # the backticks are Markdown, not a shell expansion
          # shellcheck disable=SC2016
          git diff --name-only | sed 's/^/- `/; s/$/` synced from abap2UI5/' > "$RUNNER_TEMP/shared.md"
        fi

    # `--actions` on every run: reading a release needs no more than the
    # job's read-only token; whether the moved pins under .github/workflows
    # may be pushed is decided in `pr`, by DEPS_TOKEN
    - name: npm dependencies and GitHub Actions
      if: steps.when.outputs.go == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        node .github/scripts/update-deps.mjs --actions --summary "$RUNNER_TEMP/summary.md"
        if [ -s "$RUNNER_TEMP/shared.md" ]; then
          {
            printf '**Shared files**\n\n'
            cat "$RUNNER_TEMP/shared.md"
            printf '\n'
          } >> "$RUNNER_TEMP/summary.md"
        fi

    - name: What else the addon pins
      if: steps.when.outputs.go == 'true' && inputs.extra != ''
      run: ${{ inputs.extra }}

    # outside the workspace would be cleaner, but actions/checkout writes
    # only below it - removed again before the changes are handed over
    - name: The CI template's scripts, at the commit the caller pinned
      if: steps.when.outputs.go == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ job.workflow_repository }}
        ref: ${{ job.workflow_sha }}
        path: .ci-template
        sparse-checkout: .github/ci
        persist-credentials: false
    - name: Sibling repositories to the tip of their branch
      if: steps.when.outputs.go == 'true'
      run: |
        node .ci-template/.github/ci/pin-deps.mjs bump --summary "$RUNNER_TEMP/summary.md"
        rm -rf .ci-template

    # everything changed, new files and deleted ones included, as one binary
    # patch against the commit `pr` checks out again (.gitignore keeps
    # node_modules out of it)
    - name: Hand the changes over
      if: steps.when.outputs.go == 'true'
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/bump-deps"
        git add -A
        git diff --cached --binary > "$RUNNER_TEMP/bump-deps/changes.patch"
        cp "$RUNNER_TEMP/summary.md" "$RUNNER_TEMP/bump-deps/summary.md"
        git diff --cached --stat
    - if: steps.when.outputs.go == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: bump-deps
        path: ${{ runner.temp }}/bump-deps/
        if-no-files-found: error
        retention-days: 1

  # The only job with a write token and the only one DEPS_TOKEN reaches. It
  # runs no npm and no script of the repository: a fresh checkout of the same
  # commit, the patch laid over it, the pull request. create-pull-request
  # authenticates with its own token input
  pr:
    needs: update
    if: needs.update.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: bump-deps
        path: ${{ runner.temp }}/bump-deps
    - name: Lay the changes over the checkout
      run: |
        set -euo pipefail
        if [ -s "$RUNNER_TEMP/bump-deps/changes.patch" ]; then
          git apply --binary "$RUNNER_TEMP/bump-deps/changes.patch"
        fi
        git status --short

    # without DEPS_TOKEN such changes (this template's pin among them) wait
    # for a run that has it
    - name: Without DEPS_TOKEN, leave workflow files out
      env:
        HAS_DEPS_TOKEN: ${{ secrets.DEPS_TOKEN != '' }}
      run: |
        if [ "$HAS_DEPS_TOKEN" != "true" ] && [ -n "$(git status --porcelain -- .github/workflows)" ]; then
          git checkout -- .github/workflows
          git clean -fdq -- .github/workflows
          printf -- '- left out: changes to .github/workflows (they need the DEPS_TOKEN secret)\n' >> "$RUNNER_TEMP/bump-deps/summary.md"
        fi

    - name: Open the monthly pull request
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ secrets.DEPS_TOKEN || github.token }}
        branch: bump-deps
        delete-branch: true
        title: Monthly dependency update
        commit-message: Monthly dependency update
        body-path: ${{ runner.temp }}/bump-deps/summary.md
