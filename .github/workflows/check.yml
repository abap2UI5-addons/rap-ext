# The three gates of this repo:
#   abaplint - syntax/style with dependency resolution against the
#              steampunk-2305 API set and the abap2UI5 core repo (both cloned
#              by abaplint from the URLs in abaplint.jsonc)
#   unit     - the ABAP Unit tests that need no system, transpiled
#   linter   - abap2UI5-linter: every view the floorplans build is checked
#              against the UI5 metadata (control/property/version) and
#              rendered headless. Settings live in abap2ui5lint.jsonc
# Zero issues is the gate - see AGENTS.md "Build & verify".
name: check

on:
  push:
    branches: [ main ]
  pull_request:
  # The core is pinned to a release tag (abaplint.jsonc, scripts/core-pin.mjs).
  # The weekly run is the canary against the core's main branch: a rename
  # there used to break this repository silently - every floorplan named a
  # class the core does not ship, abaplint reported 55 errors, and the badge
  # stayed green for ten days because no pull request was opened in between.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  abaplint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      # pinned through package-lock.json, so CI and `npm run lint` are the
      # same version - @latest made every run a different check
      - run: npm ci
      # the scheduled run lints against main tip instead of the pinned tag -
      # in this checkout only, it is never committed
      - name: Canary - resolve the core from main
        if: github.event_name == 'schedule'
        run: node scripts/core-pin.mjs set main
      - name: abaplint (expect 0 issues)
        run: npm run lint

  # the ABAP Unit tests that need no system (scripts/unit.mjs), transpiled
  # with open-abap-core - the parsing of the annotations and the filter and
  # search syntax the floorplans put into their dynamic SELECTs
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: ABAP Unit (transpiled)
        run: npm run unit

  view_lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # the only job here that writes: its last step publishes the badges
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # the render gate drives a headless browser
      - run: npx playwright install chromium --with-deps
      # settings come from abap2ui5lint.jsonc
      - run: npx abap2ui5lint

      # The gate above rewrote .github/badges/ (abap2ui5lint.jsonc "badge"),
      # and this step publishes those two files to the `badges` branch - an
      # orphan branch that holds nothing else and is what the README badges
      # read. They used to be committed by hand with each change, and a change
      # that left them out kept the README on a stale count. Only on main and
      # only after a green gate: a pull request run publishes nothing, the run
      # on main after the merge does. A failed push (a ruleset on the branch)
      # is a warning: the README then keeps showing the previous state rather
      # than a wrong one.
      - name: Publish the badges
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          ls .github/badges/*.json >/dev/null 2>&1 || { echo "::warning::The gate wrote no badge files - nothing to publish."; exit 0; }
          dir="$RUNNER_TEMP/badges"
          if git ls-remote --exit-code --heads origin badges >/dev/null; then
            git fetch -q --depth=1 origin badges
            git worktree add -q "$dir" FETCH_HEAD
            git -C "$dir" checkout -q -B badges
          else
            git worktree add -q --detach "$dir"
            git -C "$dir" switch -q --orphan badges
          fi
          cp .github/badges/*.json "$dir/"
          cd "$dir"
          git add -A
          if git diff --cached --quiet; then
            echo "The badges branch is up to date."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' \
            commit -qm "Badges for ${GITHUB_SHA::7}"
          if git push -q origin badges; then
            echo "Badges published to the badges branch."
          else
            echo "::warning::The badges could not be pushed to the badges branch - the README keeps showing the previous state."
          fi
