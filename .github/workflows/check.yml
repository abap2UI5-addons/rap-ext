# The two gates of this repo:
#   abaplint - syntax/style with dependency resolution against the
#              steampunk-2305 API set and the abap2UI5 core repo (both cloned
#              by abaplint from the URLs in abaplint.jsonc)
#   linter   - abap2UI5-linter: every view the floorplans build is checked
#              against the UI5 metadata (control/property/version) and
#              rendered headless. Settings live in abap2ui5lint.jsonc
# Zero issues is the gate - see AGENTS.md "Build & verify".
name: check

on:
  push:
    branches: [ main ]
  pull_request:
  # The core is resolved from its main branch with no version pin, so a rename
  # there breaks this repository silently. That is not hypothetical: every
  # floorplan named a class the core does not ship, abaplint reported 55
  # errors, and the badge stayed green for ten days because no pull request
  # was opened in between.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  abaplint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      # pinned through package-lock.json, so CI and `npm run lint` are the
      # same version - @latest made every run a different check
      - run: npm ci
      - name: abaplint (expect 0 issues)
        run: npm run lint

  view_lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # the render gate drives a headless browser
      - run: npx playwright install chromium --with-deps
      # settings come from abap2ui5lint.jsonc
      - run: npx abap2ui5lint
